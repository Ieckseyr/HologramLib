name: Docs

# 构建并发布文档站到 GitHub Pages。
# 仓库 Settings → Pages → Build and deployment → Source 必须选 “GitHub Actions”。

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 守卫：docs/internal/ 是维护者本地文档，明确禁止提交 GitHub。
  # .gitignore 已经排除它，但 .gitignore 对“已被 git 跟踪的文件”无效 ——
  # 一旦哪天被不小心 add 进去，只有 CI 能挡住。这个 job 就是那道闸。
  # ───────────────────────────────────────────────────────────────────────────
  guard-local-docs:
    name: 本地文档不得入库
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 docs/internal/ 是否被 git 跟踪
        run: |
          tracked="$(git ls-files -- docs/internal)"
          if [ -n "$tracked" ]; then
            echo "::error::docs/internal/ 是本地维护者文档（禁止提交 GitHub），但以下文件已被 git 跟踪："
            echo "$tracked"
            echo ""
            echo "修复：git rm -r --cached docs/internal && git commit"
            exit 1
          fi
          echo "OK：docs/internal/ 未被跟踪。"

      - name: 提示遗留的旧路径跳转桩
        run: |
          stale="$(git ls-files -- 'docs/*.md' 'docs/能力域' 'docs/API参考' 'docs/架构' 'docs/版本' \
                   | grep -Ev '^docs/(index|getting-started)\.md$' || true)"
          if [ -n "$stale" ]; then
            echo "::warning::以下是 ASCII 改名后遗留的旧路径跳转桩，可以从仓库里删掉："
            echo "$stale"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 构建（--strict：任何断链 / 未入 nav 的页面都会让构建失败，避免带病发布）
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: 构建
    needs: guard-local-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # 先跑严格检查：只把问题打进日志，不阻断发布。
      # 之所以不阻断：docs/ 下的页面会有意链接到 docs_dir 之外的仓库根 README
      # （如 `../../README.md#设计说明`），mkdocs 会把这类链接报成 warning。
      # 放在正式构建之前，是为了避免 strict 失败时把 site/ 留在半成品状态。
      - name: 严格检查（只报告，不阻断）
        continue-on-error: true
        run: mkdocs build --strict

      - name: 构建站点
        run: mkdocs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # ───────────────────────────────────────────────────────────────────────────
  # 发布（只在主分支 push / 手动触发时执行，PR 只构建不发布）
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: 发布到 Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
