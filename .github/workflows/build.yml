name: build

# 构建 CI。static-checks 无需私有产物, 永远跑; build 需要 BedrockProtocol 的 install 包
# 在仓库 Variables 里配 HOLO_PROTOCOL_URL（install 的 zip 直链）, 没配就跳过
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ABI 契约
        run: python tools/abi_tool.py check

      - name: 工具自测
        run: python tools/test_abi_tool.py

      - name: 导出清单（重名 + 文档总数）
        run: python tools/check_exports.py --check-docs

      # 脚本导入层是生成物：加了导出却忘了重生成，脚本侧会拿到 undefined。
      - name: 脚本导入层（生成物是否最新）
        run: python tools/gen_lse_shim.py --check

      - name: 脚本导入层自测（不需要服务器）
        run: node tools/shim_test.js

      - name: 内核层单测（不依赖 BDS）
        run: |
          g++ -std=c++20 -pthread -O1 -I src tests/registry_test.cpp -o /tmp/registry_test
          /tmp/registry_test

      - name: 点击回传契约（不依赖 BDS）
        run: |
          g++ -std=c++20 -O1 -I src tests/click_event_test.cpp -o /tmp/click_event_test
          /tmp/click_event_test

      # 编译那一关需要 HOLO_PROTOCOL_URL，没配就整关跳过。内核层这几个头是纯标准库，
      # 单独做一次语法检查，保证它们永远编得过。
      - name: 内核头文件语法检查
        run: |
          for h in Registry.h ClickEvent.h VirtualActorIds.h; do
            echo "#include \"$h\"" > /tmp/tu.cpp
            g++ -std=c++20 -fsyntax-only -I src/core /tmp/tu.cpp || exit 1
            echo "ok  src/core/$h"
          done

      - name: 装 clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      # 只查**改动的行**：本仓库没做过一次性格式化，整文件 --Werror 会被历史 violation 顶红
      # （实测 CustomEntityManager.cpp 单文件 298 处）。细节见 tools/check_format.py 文件头。
      - name: 格式检查（只查改动行）
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          python tools/check_format.py --base "$base"

  build:
    name: 编译
    runs-on: windows-latest
    needs: static-checks
    if: ${{ vars.HOLO_PROTOCOL_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v2
        with:
          xmake-version: latest

      - name: 取 BedrockProtocol
        shell: pwsh
        env:
          URL: ${{ vars.HOLO_PROTOCOL_URL }}
        run: |
          Invoke-WebRequest -Uri $env:URL -OutFile "$env:RUNNER_TEMP\protocol.zip"
          Expand-Archive "$env:RUNNER_TEMP\protocol.zip" -DestinationPath "$env:RUNNER_TEMP\protocol"
          if (!(Test-Path "$env:RUNNER_TEMP\protocol\install\include")) {
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\protocol\install" | Out-Null
            Copy-Item "$env:RUNNER_TEMP\protocol\*" "$env:RUNNER_TEMP\protocol\install\" -Recurse -Force
          }
          "HOLO_PROTOCOL_DIR=$env:RUNNER_TEMP\protocol\install" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 配置
        run: xmake f -c --holo_werror=y -y

      - name: 构建
        run: xmake build -y

  build-skipped:
    name: 编译（跳过）
    runs-on: ubuntu-latest
    needs: static-checks
    if: ${{ vars.HOLO_PROTOCOL_URL == '' }}
    steps:
      - name: 说明
        run: |
          echo "::warning::没配 HOLO_PROTOCOL_URL，这一关只跑了静态检查，源码没有被编译过。"
          echo "Settings → Secrets and variables → Actions → Variables → HOLO_PROTOCOL_URL = install 的 zip 直链"
          {
            echo "### 编译未执行"
            echo ""
            echo "编译需要 BedrockProtocol / LeviLamina 的头文件；仓库变量 \`HOLO_PROTOCOL_URL\` 没配时这一关整关跳过。"
            echo ""
            echo "已经跑过的：ABI 契约、工具自测、导出清单、内核层单测、点击回传契约、内核头语法检查、格式检查。"
            echo ""
            echo "**源码本身没有被编译过**，合并前请在本地跑一次 \`xmake build -y\`。"
          } >> "$GITHUB_STEP_SUMMARY"
