# HologramLib 文档站配置（MkDocs Material + mkdocs-static-i18n）
#
# 本地预览：
#   pip install -r requirements.txt
#   mkdocs serve            # http://127.0.0.1:8000
# 构建：
#   mkdocs build --strict
#
# 部署：推送到主分支后由 .github/workflows/docs.yml 自动发布到 GitHub Pages。

# ─────────────────────────────────────────────────────────────────────────────
# 下面两处是真实仓库 / GitHub Pages 地址（进 sitemap 与页面链接）。
site_url: https://ieckseyr.github.io/HologramLib/
repo_url: https://github.com/Ieckseyr/HologramLib
edit_uri: edit/main/docs/
# ─────────────────────────────────────────────────────────────────────────────

site_name: HologramLib
site_description: 基岩版协议层统一悬浮显示库 · Bedrock protocol-layer unified hologram & display library
docs_dir: ../docs
site_dir: ../site
use_directory_urls: true

# ⚠ 刻意**不**在这里打开 strict：
# docs/ 下的页面会有意链接到 docs_dir 之外的仓库根 README（如 `../../README.md#设计说明`），
# mkdocs 会把这类「目标不在文档集里」的链接报成 warning，strict 会让整次构建直接失败、站点发不出去。
# 需要严格检查时用 CI 里那条 `mkdocs build --strict`（它不阻断发布）。

copyright: |
  HologramLib · MIT（悬浮字「动态行」部分按 LGPL-3.0）· 运行于 LeviLamina 26.51 / BDS 1.26.51

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切到浅色

# docs/internal/ 是维护者本地文档（.gitignore 排除、禁止提交 GitHub），
# 因此必须排除出站点构建，绝不能让它们出现在公开文档站上。
# 其余条目是 ASCII slug 改名后留下的旧路径跳转桩，同样不参与构建。
exclude_docs: |
  internal/
  /README.md
  快速开始.md
  能力域/
  API参考/
  架构/
  版本/
  # 站点只放「怎么用」：开发者内参留在仓库里，不上站
  architecture/
  design-contracts.md
  versions/api-version-matrix.md

plugins:
  - search:
      separator: '[\s\u200b\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - i18n:
      docs_structure: suffix          # 英文版 = <原名>.en.md，未翻译的页面自动回落中文
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          site_description: Bedrock protocol-layer unified hologram & display library
          nav_translations:
            首页: Home
            快速开始: Getting started
            设计说明: Design notes
            能力域指南: Capability domains
            总览: Overview
            渲染与文本: Rendering & text
            实体与 NPC: Entities & NPCs
            界面与容器: Interfaces & containers
            视图覆盖与感知: View override & sensing
            DebugShape（悬浮字与形状）: DebugShape (holograms & shapes)
            物品显示: Item display
            粒子: Particles
            实体与交互: Entities & interaction
            假玩家 NPC: Fake-player NPC
            容器与背包: Containers & inventory
            界面: Interfaces
            硫磺立方体: Sulfur cube
            视图覆盖: View override
            客户端感知: Client sensing
            API 参考: API reference
            C++ 接口: C++ API
            LSE 接口: LSE API
            架构: Architecture
            架构总览: Architecture overview
            协议层实现笔记: Protocol notes
            版本: Versions
            更新日志: Changelog
            版本与 ABI 对照: Version & ABI matrix
            LSE 脚本接口: LSE scripting API
            怎么用: How to use it
            形状: Shapes
            悬浮字与渐变线: Holograms & gradient lines
            物品显示: Item display
            假玩家 NPC: Fake-player NPCs
            实体、粒子与交互: Entities, particles & interaction
            背包与硫磺立方体: Inventory & sulfur cube
            C++ 接口参考: C++ API reference
            更新日志: Changelog

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - LSE 脚本接口:
      - 怎么用: lse/index.md
      - 形状: lse/shapes.md
      - 悬浮字与渐变线: lse/holograms.md
      - 物品显示: lse/items.md
      - 假玩家 NPC: lse/player-npc.md
      - 实体、粒子与交互: lse/entities.md
      - 界面与容器: lse/interfaces.md
      - 背包与硫磺立方体: lse/inventory.md
      - 视图覆盖与感知: lse/view.md
  - C++ 接口参考: reference/cpp-api.md
  - 能力域:
      - 总览: domains/README.md
      - DebugShape（悬浮字与形状）: domains/debugshape.md
      - 物品显示: domains/item-display.md
      - 粒子: domains/particles.md
      - 实体与交互: domains/entities.md
      - 假玩家 NPC: domains/player-npc.md
      - 容器与背包: domains/containers.md
      - 界面: domains/interfaces.md
      - 硫磺立方体: domains/sulfur.md
      - 视图覆盖: domains/view.md
      - 客户端感知: domains/sensing.md
  - 更新日志: versions/changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ieckseyr/HologramLib
