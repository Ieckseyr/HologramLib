# HologramLib 文档站配置（MkDocs Material + mkdocs-static-i18n）
#
# 本地预览：
#   pip install -r requirements.txt
#   mkdocs serve            # http://127.0.0.1:8000
# 构建：
#   mkdocs build --strict
#
# 部署：推送到主分支后由 .github/workflows/docs.yml 自动发布到 GitHub Pages。

# ─────────────────────────────────────────────────────────────────────────────
# 下面两处是真实仓库 / GitHub Pages 地址（进 sitemap 与页面链接）。
site_url: https://ieckseyr.github.io/HologramLib/
repo_url: https://github.com/Ieckseyr/HologramLib
edit_uri: edit/main/docs/
# ─────────────────────────────────────────────────────────────────────────────

site_name: HologramLib
site_description: 基岩版协议层统一悬浮显示库 · Bedrock protocol-layer unified hologram & display library
docs_dir: ../docs
site_dir: ../site
use_directory_urls: true

# ⚠ 刻意**不**在这里打开 strict：
# docs/ 下的页面会有意链接到 docs_dir 之外的仓库根 README（如 `../../README.md#设计说明`），
# mkdocs 会把这类「目标不在文档集里」的链接报成 warning，strict 会让整次构建直接失败、站点发不出去。
# 需要严格检查时用 CI 里那条 `mkdocs build --strict`（它不阻断发布）。

copyright: |
  HologramLib · MIT（悬浮字「动态行」部分按 LGPL-3.0）· 运行于 LeviLamina 26.51 / BDS 1.26.51

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切到浅色

# docs/internal/ 是维护者本地文档（.gitignore 排除、禁止提交 GitHub），
# 因此必须排除出站点构建，绝不能让它们出现在公开文档站上。
# 其余条目是 ASCII slug 改名后留下的旧路径跳转桩，同样不参与构建。
exclude_docs: |
  internal/
  /README.md
  快速开始.md
  能力域/
  API参考/
  架构/
  版本/
  # 站点只放「怎么用」：开发者内参留在仓库里，不上站
  architecture/
  design-contracts.md
  versions/api-version-matrix.md

plugins:
  - search:
      separator: '[\s\u200b\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - i18n:
      docs_structure: suffix          # 英文版 = <原名>.en.md，未翻译的页面自动回落中文
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          site_description: Bedrock protocol-layer unified hologram & display library
          nav_translations:
