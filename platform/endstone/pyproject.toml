[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-hologramlib"
version = "26.60.2"
description = "HologramLib protocol-layer display library for Endstone servers (Minecraft Bedrock 26.60)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "伊希娅 EPSILON killcerr" }]
keywords = ["endstone", "plugin", "hologram", "bedrock"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["endstone>=0.11"]

[project.entry-points."endstone"]
hologramlib = "hologramlib_endstone:HologramLibPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/hologramlib_endstone"]

[tool.hatch.build.targets.wheel.force-include]
"src/hologramlib_endstone/_native" = "hologramlib_endstone/_native"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "E", "F"]
